name: MyStocks Research

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years of history'
        required: false
        default: '10'
  schedule:
    - cron: '30 13 * * 1-5'

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run research
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/run_research.py --years ${{ inputs.years || '10' }} --refresh
      - name: Publish research artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystocks-research
          path: data/research_summary.csv
