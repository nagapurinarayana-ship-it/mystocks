name: MyStocks Research

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Maximum years of history to download'
        required: false
        default: '10'
  schedule:
    - cron: '30 13 * * 1-5'

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full-universe multi-history research
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/run_research.py --years ${{ inputs.years || '10' }} --refresh --discover-nse
      - name: Upload complete research outputs
        uses: actions/upload-artifact@v4
        with:
          name: mystocks-research-${{ github.run_number }}
          path: |
            data/nse_current_universe.csv
            data/research_summary.csv
            data/research_baselines.csv
            data/walk_forward_folds.csv
            data/walk_forward_summary.csv
            data/less_than_1_year.csv
          if-no-files-found: error
